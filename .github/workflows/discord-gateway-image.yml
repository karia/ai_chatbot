name: Discord gateway image

on:
  push:
    branches: [main]
    paths:
      - src/discord_gateway/**
      - .github/workflows/discord-gateway-image.yml

concurrency:
  group: discord-gateway-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/discord_gateway
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/karia/ai-chatbot-discord-gateway:${{ github.sha }}
            ghcr.io/karia/ai-chatbot-discord-gateway:latest
